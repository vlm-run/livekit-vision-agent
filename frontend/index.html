<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live vision · LiveKit × VLM Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// livekit-client calls crypto.randomUUID, which browsers only define on https or localhost.
if (!crypto.randomUUID) {
  crypto.randomUUID = () => "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
    (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
}
</script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    --background: hsl(224 10% 10%); --card: hsl(224 8% 13%); --border: hsl(224 10% 22%);
    --foreground: hsl(0 0% 98%); --muted: hsl(0 0% 70%); --primary: hsl(224 76.3% 48%);
    --primary-soft: hsl(224 76.3% 62%); --radius: .4rem;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--background); color:var(--foreground); font:14px/1.45 Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  header { display:flex; align-items:center; gap:10px; padding:12px 24px; border-bottom:1px solid var(--border); }
  header b { font-weight:600; font-size:15px; }
  header .sub { color:var(--muted); }
  #status { margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
  #status::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--muted); }
  #status.live::before { background:var(--primary-soft); box-shadow:0 0 0 3px hsl(224 76.3% 48% / .3); }
  main { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; padding:20px 24px; max-width:1400px; margin:auto; }
  @media (max-width:960px) { main { grid-template-columns:1fr; } }
  .caps { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .rail { display:flex; flex-direction:column; gap:20px; min-width:0; }
  .stage { position:relative; aspect-ratio:16/9; background:#000; border-radius:var(--radius); overflow:hidden; }
  .stage canvas, .stage video.main { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .pip { position:absolute; right:12px; bottom:12px; width:22%; aspect-ratio:16/9; border-radius:var(--radius); overflow:hidden; border:1px solid hsl(0 0% 100% / .25); background:#000; }
  .pip video { width:100%; height:100%; object-fit:cover; display:block; }
  .pip span { position:absolute; left:6px; top:5px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#fff; text-shadow:0 0 4px #000; }
  .empty[hidden] { display:none; }
  .empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); }
  .metrics { display:flex; gap:32px; padding:14px 2px 0; }
  .metrics b { display:block; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .metrics span { color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .clips { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .clip { background:none; border:0; padding:0; color:var(--foreground); text-align:left; cursor:pointer; font:inherit; font-size:12px; }
  .clip video { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; border-radius:var(--radius); background:#000; box-shadow:0 0 0 1px var(--border); pointer-events:none; }
  .clip:hover video { box-shadow:0 0 0 1px var(--muted); }
  .clip[aria-pressed=true] video { box-shadow:0 0 0 2px var(--primary); }
  .clip span { display:block; margin-top:4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .models { display:flex; flex-wrap:wrap; gap:6px; }
  .models button { background:none; border:1px solid var(--border); color:var(--foreground); border-radius:var(--radius); padding:6px 12px; font:inherit; cursor:pointer; }
  .models button:hover { border-color:var(--muted); }
  .models button[aria-pressed=true] { background:var(--primary); border-color:var(--primary); }
  input { width:100%; margin-top:10px; background:var(--background); border:1px solid var(--border); color:var(--foreground); border-radius:var(--radius); padding:7px 10px; font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--primary-soft); outline-offset:1px; }
  .logs { grid-column:1/-1; }
  .logs .scroll { max-height:260px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
  th { text-align:left; color:var(--muted); font-weight:500; padding:0 10px 6px 0; position:sticky; top:0; background:var(--card); }
  td { padding:4px 10px 4px 0; border-top:1px solid var(--border); vertical-align:top; }
  td.t { color:var(--muted); white-space:nowrap; width:1%; }
  td.k { white-space:nowrap; width:1%; }
  .tag { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px; border:1px solid currentColor; }
  td.d { color:var(--muted); word-break:break-word; }
  details summary { cursor:pointer; }
  pre { margin:10px 0 0; max-height:240px; overflow:auto; font:12px/1.5 ui-monospace,monospace; color:var(--muted); white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<header>
  <b>VLM Run</b><span class="sub">Live vision on LiveKit</span>
  <span id="status">pick a clip</span>
</header>
<main>
  <div>
    <div class="stage">
      <canvas id="view"></canvas>
      <div class="empty" id="empty">Pick a clip to start</div>
      <div class="pip"><video id="src" muted loop playsinline crossorigin="anonymous"></video><span>source</span></div>
    </div>
    <div class="metrics">
      <div><b id="last">–</b><span>last ms</span></div>
      <div><b id="p50">–</b><span>median ms</span></div>
      <div><b id="fps">–</b><span>results / s</span></div>
    </div>
  </div>
  <div class="rail">
    <section class="card">
      <p class="caps">Model</p>
      <div class="models" id="models"></div>
      <input id="prompt" placeholder="prompt" hidden>
    </section>
    <section class="card">
      <p class="caps">Clips</p>
      <div class="clips" id="clips"></div>
    </section>
    <section class="card">
      <details>
        <summary class="caps" style="margin:0">Result JSON</summary>
        <pre id="json">waiting for the agent</pre>
      </details>
    </section>
  </div>
  <section class="card logs">
    <p class="caps">Logs</p>
    <div class="scroll">
      <table>
        <thead><tr><th>Time</th><th>Event</th><th>Detail</th></tr></thead>
        <tbody id="logs"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const BASE = "https://storage.googleapis.com/vlm-data-public-prod/";
const CLIPS = [
  ["Warehouse forklifts", "hub/examples/video/warehouse-forklifts-yard-aerial.mp4"],
  ["Pallet jack aisle", "hub/examples/video/warehouse-pallet-jack-aisle.mp4"],
  ["Reach truck, hi-vis", "hub/examples/video/warehouse-reach-truck-hivis-aisle.mp4"],
  ["Drill press", "hub/examples/video/manufacturing-drill-press-machining.mp4"],
  ["Pipe welding", "hub/examples/video/industrial-pipe-welding-inspection.mp4"],
  ["Robot manipulation", "hub/examples/video.agent/robotics_manipulation_tracking.mp4"],
  ["Dashcam", "hub/examples/video.dashcam/00914.mp4"],
  ["Home workout", "gw/examples/fitness-home-workout.mp4"],
];
// [label, model, method, default prompt ("" hides the prompt box)]
const MODELS = [
  ["Gemma 4 e2b", "google/gemma4-e2b-it:realtime", "chat", "Describe the frame in one sentence."],
  ["ViTPose+", "usyd-community/vitpose-plus-large", "pose", ""],
  ["RF-DETR", "roboflow/rfdetr-large", "detect", ""],
  ["SAM 3.1", "facebook/sam3.1", "segment", "person"],
];
const { Room, RoomEvent, LocalVideoTrack, Track } = LivekitClient;
const $ = (id) => document.getElementById(id);
const src = $("src"), view = $("view"), promptEl = $("prompt"), statusEl = $("status");

let room = null, track = null, clip = null, model = MODELS[0];
const frames = new Map(), results = new Map();
let shown = -1;
const latencies = [], stamps = [];

const TAGS = { connected: "#2dd4bf", clip: "#38bdf8", model: "#c084fc", "session.start": "#fb923c", "session.open": "#a3e635",
  "session.close": "#8a93a0", "session.failed": "#f87171", "frame.failed": "#f87171", result: "#818cf8", error: "#f87171" };
function log(kind, detail) {
  const row = document.createElement("tr");
  const color = TAGS[kind] || "#8a93a0";
  row.innerHTML = `<td class="t">${new Date().toLocaleTimeString([], { hour12: false })}</td>
    <td class="k"><span class="tag" style="color:${color}">${kind}</span></td><td class="d"></td>`;
  row.lastElementChild.textContent = detail;
  $("logs").prepend(row);
  while ($("logs").childElementCount > 150) $("logs").lastChild.remove();
}
const fields = (o) => Object.entries(o).filter(([k]) => k !== "event").map(([k, v]) => `${k}=${v}`).join("  ");

function say(text, live) { statusEl.textContent = text; statusEl.classList.toggle("live", !!live); }

// ---- controls
CLIPS.forEach((c) => {
  const b = document.createElement("button");
  b.className = "clip";
  b.dataset.clip = c[0];
  b.innerHTML = `<video src="${BASE + c[1]}#t=1" preload="metadata" muted playsinline crossorigin="anonymous"></video><span>${c[0]}</span>`;
  b.onclick = () => play(c);
  $("clips").append(b);
});
MODELS.forEach((m) => {
  const b = document.createElement("button");
  b.textContent = m[0];
  b.dataset.model = m[1];
  b.onclick = () => pick(m);
  $("models").append(b);
});
function mark() {
  for (const b of $("clips").children) b.setAttribute("aria-pressed", !!clip && b.dataset.clip === clip[0]);
  for (const b of $("models").children) b.setAttribute("aria-pressed", b.dataset.model === model[1]);
  promptEl.hidden = !model[3];
}

async function pick(m) {
  model = m;
  promptEl.value = m[3];
  mark();
  await sendControl();
}
promptEl.onchange = sendControl;

async function sendControl() {
  if (!room || room.state !== "connected" || !clip) return;
  shown = -1;
  frames.clear(); results.clear();
  await room.localParticipant.sendText(
    JSON.stringify({ model: model[1], method: model[2], prompt: promptEl.value.trim() }),
    { topic: "control" });
  log("model", `${model[1]} · ${model[2]}${promptEl.value.trim() ? " · " + promptEl.value.trim() : ""}`);
  say(`${clip[0]} · ${model[0]}`, true);
}

// ---- publish the playing clip as the room's camera
async function play(c) {
  clip = c;
  mark();
  try {
    const r = await connect();
    await unpublish();
    src.src = BASE + c[1];
    await src.play();
    const stream = (src.captureStream || src.mozCaptureStream).call(src);
    track = new LocalVideoTrack(stream.getVideoTracks()[0]);
    await r.localParticipant.publishTrack(track, { simulcast: false, source: Track.Source.Camera });
    log("clip", `${c[0]} published`);
    await sendControl();
  } catch (err) {
    log("error", err.message || String(err));
    say("error: " + (err.message || err));
  }
}
async function unpublish() {
  if (!track) return;
  await room.localParticipant.unpublishTrack(track);
  track = null;
}

// ---- the agent sends the JPEG the model saw, then its JSON; they pair up by seq
async function connect() {
  if (room) return room;
  const { url, token } = await (await fetch("/token")).json();
  const r = new Room({ adaptiveStream: false, dynacast: false });
  r.registerByteStreamHandler("frame", async (reader) => {
    const info = reader.info || {};
    const id = String((info.attributes && info.attributes.frame) || info.name || "");
    if (!id || Number(id) < shown) return;
    const parts = await reader.readAll();
    frames.set(id, await createImageBitmap(new Blob(Array.isArray(parts) ? parts : [parts], { type: "image/jpeg" })));
    draw(id);
  });
  r.registerTextStreamHandler("vision", async (reader) => {
    let body;
    try { body = JSON.parse(await reader.readAll()); } catch { return; }
    $("json").textContent = JSON.stringify(body, null, 2);
    const meta = body._vlmrun || {};
    if (meta.latency_ms != null) metrics(meta.latency_ms);
    log("result", `#${meta.seq}  ${meta.latency_ms} ms  gateway ${meta.gateway_ms != null ? Math.round(meta.gateway_ms) : "–"} ms  ${Array.isArray(body.items) ? body.items.length + " items" : "text"}`);
    if (meta.seq != null) { results.set(String(meta.seq), body); draw(String(meta.seq)); }
  });
  r.registerTextStreamHandler("log", async (reader) => {
    try {
      const e = JSON.parse(await reader.readAll());
      log(e.event, fields(e));
    } catch {}
  });
  r.on(RoomEvent.Disconnected, () => { room = null; say("disconnected"); log("session.close", "room disconnected"); });
  // The agent joins after the page does; hand it the current choice when it arrives.
  r.on(RoomEvent.ParticipantConnected, () => sendControl());
  await r.connect(url, token);
  room = r;
  log("connected", r.name);
  return r;
}

function metrics(ms) {
  latencies.push(ms); if (latencies.length > 30) latencies.shift();
  const now = performance.now(); stamps.push(now);
  while (stamps[0] < now - 5000) stamps.shift();
  const sorted = [...latencies].sort((a, b) => a - b);
  $("last").textContent = ms;
  $("p50").textContent = sorted[sorted.length >> 1];
  $("fps").textContent = (stamps.length / Math.min(5, (now - stamps[0]) / 1000 || 1)).toFixed(1);
}

function draw(id) {
  const bitmap = frames.get(id), body = results.get(id);
  if (!bitmap || !body) return;
  $("empty").hidden = true;
  view.width = bitmap.width; view.height = bitmap.height;
  const ctx = view.getContext("2d");
  ctx.drawImage(bitmap, 0, 0);
  paint(ctx, body, bitmap.width, bitmap.height);
  shown = Number(id);
  for (const map of [frames, results]) for (const k of map.keys()) if (Number(k) <= shown) map.delete(k);
}

// ---- overlay, as in the VLM Run /live page: class-coloured boxes with label chips, and
// OpenPose-style limbs (thick, translucent, rainbow-ordered) with a dot on every joint.
const PALETTE = ["#38bdf8", "#f472b6", "#a3e635", "#fb923c", "#c084fc", "#2dd4bf", "#f87171", "#818cf8"];
const classColor = (name) => {
  let hash = 0;
  for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) | 0;
  return PALETTE[Math.abs(hash) % PALETTE.length];
};
const OPENPOSE_COLORS = ["#ff0000","#ff5500","#ffaa00","#ffff00","#aaff00","#55ff00","#00ff00","#00ff55","#00ffaa","#00ffff","#00aaff","#0055ff","#0000ff","#5500ff","#aa00ff","#ff00ff","#ff00aa","#ff0055"];
const COCO = ["nose","left_eye","right_eye","left_ear","right_ear","left_shoulder","right_shoulder","left_elbow","right_elbow","left_wrist","right_wrist","left_hip","right_hip","left_knee","right_knee","left_ankle","right_ankle"];
const JOINTS = ["nose","neck","right_shoulder","right_elbow","right_wrist","left_shoulder","left_elbow","left_wrist","right_hip","right_knee","right_ankle","left_hip","left_knee","left_ankle","right_eye","left_eye","right_ear","left_ear"];
const LIMBS = [["neck","right_shoulder"],["neck","left_shoulder"],["right_shoulder","right_elbow"],["right_elbow","right_wrist"],["left_shoulder","left_elbow"],["left_elbow","left_wrist"],["neck","right_hip"],["right_hip","right_knee"],["right_knee","right_ankle"],["neck","left_hip"],["left_hip","left_knee"],["left_knee","left_ankle"],["neck","nose"],["nose","right_eye"],["right_eye","right_ear"],["nose","left_eye"],["left_eye","left_ear"]];
const MIN_SCORE = 0.3;

function paint(ctx, body, w, h) {
  const items = Array.isArray(body.items) ? body.items : [];
  const font = Math.max(11, Math.round(h * 0.024));
  ctx.font = `500 ${font}px Inter, system-ui, sans-serif`;
  ctx.lineCap = "round";
  const segment = body.object && body.object.includes("segment");
  items.forEach((item, i) => {
    const [bx, by, bw, bh] = (item.bbox_xywh || [0, 0, 0, 0]).map((v, k) => v * (k % 2 ? h : w));
    if (item.kpts_xy) return pose(ctx, item, w, h, bh);
    if (!item.bbox_xywh) return;
    const color = segment ? PALETTE[i % PALETTE.length] : classColor(item.label || "");
    ctx.strokeStyle = color;
    ctx.lineWidth = segment ? 1.25 : 2;
    ctx.strokeRect(bx, by, bw, bh);
    const label = item.label || "object";
    const text = item.score != null ? `${label} ${item.score.toFixed(2)}` : label;
    const pad = font * 0.25, chip = font + pad;
    const top = by >= chip ? by - chip : by;
    ctx.globalAlpha = 0.85; ctx.fillStyle = color;
    ctx.fillRect(bx, top, ctx.measureText(text).width + pad * 2, chip);
    ctx.globalAlpha = 1; ctx.fillStyle = "#0a0a0a";
    ctx.fillText(text, bx + pad, top + font * 0.92);
  });
  const caption = body.text || body.value;
  if (typeof caption === "string") {
    ctx.fillStyle = "rgba(10,10,10,.75)";
    ctx.fillRect(0, h - font * 3, w, font * 3);
    ctx.fillStyle = "#fff";
    ctx.fillText(caption.slice(0, Math.floor(w / (font * 0.55))), font * 0.6, h - font * 1.1);
  }
}

function pose(ctx, item, w, h, boxH) {
  const px = item.kpts_xy.some((p) => p && (p[0] > 1.5 || p[1] > 1.5));
  const scores = item.kpts_score || [];
  const joints = new Map();
  item.kpts_xy.forEach((p, j) => {
    if (p && (scores[j] ?? 1) >= MIN_SCORE) joints.set(COCO[j], { x: p[0] * (px ? 1 : w), y: p[1] * (px ? 1 : h) });
  });
  const l = joints.get("left_shoulder"), r = joints.get("right_shoulder");
  if (l && r) joints.set("neck", { x: (l.x + r.x) / 2, y: (l.y + r.y) / 2 });
  const limb = Math.min(7, Math.max(2, (boxH || h * 0.3) * 0.022));
  ctx.lineWidth = limb;
  LIMBS.forEach(([from, to], i) => {
    const a = joints.get(from), b = joints.get(to);
    if (!a || !b) return;
    ctx.globalAlpha = 0.7; ctx.strokeStyle = OPENPOSE_COLORS[i];
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
  ctx.globalAlpha = 1;
  JOINTS.forEach((name, i) => {
    const p = joints.get(name);
    if (!p) return;
    ctx.fillStyle = OPENPOSE_COLORS[i];
    ctx.beginPath(); ctx.arc(p.x, p.y, limb * 0.7, 0, 7); ctx.fill();
  });
}
promptEl.value = model[3];
mark();
</script>
</body>
</html>
