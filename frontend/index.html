<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live vision · LiveKit × VLM Run</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  :root { color-scheme: dark; --bg:#0b0d10; --panel:#12151a; --line:#232830; --fg:#e6e8eb; --mute:#8a93a0; --acc:#7ee787; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; }
  header { display:flex; align-items:baseline; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; font-weight:600; }
  header span, .caps { color:var(--mute); }
  .caps { font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 8px; font-weight:500; }
  main { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:16px; padding:16px 20px; max-width:1500px; margin:auto; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; min-width:0; }
  .panel + .panel { margin-top:16px; }
  .stage { position:relative; aspect-ratio:16/9; background:#000; border-radius:6px; overflow:hidden; }
  .stage video, .stage canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .clips { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .clip { background:none; border:0; padding:0; color:var(--fg); text-align:left; cursor:pointer; font:inherit; font-size:12px; }
  .clip video { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:5px; background:#000; display:block; box-shadow:0 0 0 1px var(--line); pointer-events:none; }
  .clip[aria-pressed=true] video { box-shadow:0 0 0 2px var(--acc); }
  .clip span { display:block; margin-top:3px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .models { display:flex; flex-wrap:wrap; gap:6px; }
  .models button { background:none; border:1px solid var(--line); color:var(--fg); border-radius:5px; padding:5px 10px; font:inherit; cursor:pointer; }
  .models button[aria-pressed=true] { border-color:var(--acc); color:var(--acc); }
  input { background:var(--bg); border:1px solid var(--line); color:var(--fg); border-radius:5px; padding:5px 8px; font:inherit; width:100%; margin-top:8px; }
  .metrics { display:flex; gap:24px; margin:12px 0; }
  .metrics b { display:block; font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .metrics span { color:var(--mute); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  pre { margin:0; max-height:260px; overflow:auto; font:12px/1.45 ui-monospace,monospace; color:var(--mute); white-space:pre-wrap; word-break:break-word; }
  #status { color:var(--mute); margin-left:auto; }
</style>
</head>
<body>
<header>
  <h1>Live vision</h1>
  <span>stock clip → LiveKit room → agent → VLM Run <code>/v1/ws</code></span>
  <span id="status">pick a clip</span>
</header>
<main>
  <div>
    <section class="panel">
      <p class="caps">Source</p>
      <div class="stage"><video id="src" muted loop playsinline crossorigin="anonymous"></video></div>
    </section>
    <section class="panel">
      <p class="caps">Clips</p>
      <div class="clips" id="clips"></div>
    </section>
    <section class="panel">
      <p class="caps">Model</p>
      <div class="models" id="models"></div>
      <input id="prompt" placeholder="prompt" hidden>
    </section>
  </div>
  <section class="panel">
    <p class="caps">What the model saw</p>
    <div class="stage"><canvas id="view"></canvas></div>
    <div class="metrics">
      <div><b id="last">–</b><span>last ms</span></div>
      <div><b id="p50">–</b><span>median ms</span></div>
      <div><b id="fps">–</b><span>results / s</span></div>
    </div>
    <p class="caps">Result</p>
    <pre id="json">waiting for the agent</pre>
  </section>
</main>
<script>
const BASE = "https://storage.googleapis.com/vlm-data-public-prod/";
const CLIPS = [
  ["Home workout", "gw/examples/fitness-home-workout.mp4"],
  ["Hip-hop dance", "gw/examples/dance-dancetrack-hiphop.mp4"],
  ["Soccer juggling", "gw/examples/sports-soccer-juggling.mp4"],
  ["Factory worker", "hub/examples/robotics.agent/factory001_worker001_v2.mp4"],
  ["Dashcam", "hub/examples/video.dashcam/00914.mp4"],
  ["Overhead traffic", "hub/examples/video.agent/overhead_traffic.mp4"],
];
// [label, model, method, default prompt ("" hides the prompt box)]
const MODELS = [
  ["ViTPose+", "usyd-community/vitpose-plus-large", "pose", ""],
  ["RF-DETR", "roboflow/rfdetr-large", "detect", ""],
  ["SAM 3.1", "facebook/sam3.1", "segment", "person"],
  ["Gemma 4 e2b", "google/gemma4-e2b-it:realtime", "chat", "Describe the frame in one sentence."],
  ["PP-OCRv6", "paddleocr/pp-ocrv6", "ocr", ""],
];
const { Room, RoomEvent, LocalVideoTrack, Track } = LivekitClient;
const $ = (id) => document.getElementById(id);
const src = $("src"), view = $("view"), promptEl = $("prompt"), statusEl = $("status");

let room = null, track = null, clip = CLIPS[0], model = MODELS[0];
const frames = new Map(), results = new Map();
let shown = -1;
const latencies = [], stamps = [];

// ---- controls
CLIPS.forEach((c) => {
  const b = document.createElement("button");
  b.className = "clip";
  b.innerHTML = `<video src="${BASE + c[1]}#t=1" preload="metadata" muted playsinline crossorigin="anonymous"></video><span>${c[0]}</span>`;
  b.onclick = () => play(c);
  b.dataset.clip = c[0];
  $("clips").append(b);
});
MODELS.forEach((m) => {
  const b = document.createElement("button");
  b.textContent = m[0];
  b.onclick = () => pick(m);
  b.dataset.model = m[1];
  $("models").append(b);
});
function mark() {
  for (const b of $("clips").children) b.setAttribute("aria-pressed", b.dataset.clip === clip[0]);
  for (const b of $("models").children) b.setAttribute("aria-pressed", b.dataset.model === model[1]);
  promptEl.hidden = !model[3];
}

async function pick(m) {
  model = m;
  promptEl.value = m[3];
  mark();
  await sendControl();
}
promptEl.onchange = sendControl;

async function sendControl() {
  if (!room || room.state !== "connected") return;
  shown = -1;
  frames.clear(); results.clear();
  await room.localParticipant.sendText(
    JSON.stringify({ model: model[1], method: model[2], prompt: promptEl.value.trim() }),
    { topic: "control" });
  statusEl.textContent = `${clip[0]} · ${model[0]}`;
}

// ---- publish the playing clip as the room's camera
async function play(c) {
  clip = c;
  mark();
  try {
    const r = await connect();
    await unpublish();
    src.src = BASE + c[1];
    await src.play();
    const stream = (src.captureStream || src.mozCaptureStream).call(src);
    track = new LocalVideoTrack(stream.getVideoTracks()[0]);
    await r.localParticipant.publishTrack(track, { simulcast: false, source: Track.Source.Camera });
    await sendControl();
  } catch (err) {
    statusEl.textContent = "error: " + (err.message || err);
  }
}
async function unpublish() {
  if (!track) return;
  await room.localParticipant.unpublishTrack(track);
  track = null;
}

// ---- results come back as the JPEG the model saw, then its JSON, matched by seq
async function connect() {
  if (room) return room;
  const { url, token } = await (await fetch("/token")).json();
  const r = new Room({ adaptiveStream: false, dynacast: false });
  r.registerByteStreamHandler("frame", async (reader) => {
    const info = reader.info || {};
    const id = String((info.attributes && info.attributes.frame) || info.name || "");
    if (!id || Number(id) < shown) return;
    const parts = await reader.readAll();
    frames.set(id, await createImageBitmap(new Blob(Array.isArray(parts) ? parts : [parts], { type: "image/jpeg" })));
    draw(id);
  });
  r.registerTextStreamHandler("vision", async (reader) => {
    const text = await reader.readAll();
    let body;
    try { body = JSON.parse(text); } catch { return; }
    $("json").textContent = JSON.stringify(body, null, 2);
    const meta = body._vlmrun || {};
    if (meta.latency_ms != null) metrics(meta.latency_ms);
    if (meta.seq != null) { results.set(String(meta.seq), body); draw(String(meta.seq)); }
  });
  r.on(RoomEvent.Disconnected, () => { room = null; statusEl.textContent = "disconnected"; });
  await r.connect(url, token);
  room = r;
  return r;
}

function metrics(ms) {
  latencies.push(ms); if (latencies.length > 30) latencies.shift();
  const now = performance.now(); stamps.push(now);
  while (stamps[0] < now - 5000) stamps.shift();
  const sorted = [...latencies].sort((a, b) => a - b);
  $("last").textContent = ms;
  $("p50").textContent = sorted[sorted.length >> 1];
  $("fps").textContent = (stamps.length / Math.min(5, (now - stamps[0]) / 1000 || 1)).toFixed(1);
}

function draw(id) {
  const bitmap = frames.get(id), body = results.get(id);
  if (!bitmap || !body) return;
  view.width = bitmap.width; view.height = bitmap.height;
  const ctx = view.getContext("2d");
  ctx.drawImage(bitmap, 0, 0);
  paint(ctx, body, bitmap.width, bitmap.height);
  shown = Number(id);
  for (const map of [frames, results]) for (const k of map.keys()) if (Number(k) <= shown) map.delete(k);
}

// ---- overlay: boxes, skeletons, OCR text, or a caption, whatever the result holds
const COCO = [[0,1],[0,2],[1,3],[2,4],[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
const HAND = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20]];
const COLORS = ["#7ee787", "#79c0ff", "#ffa657", "#d2a8ff", "#ff7b72"];

function paint(ctx, body, w, h) {
  const items = Array.isArray(body.items) ? body.items : [];
  const font = Math.max(12, Math.round(h * 0.03));
  ctx.font = `600 ${font}px system-ui`;
  ctx.lineWidth = Math.max(2, h / 300);
  items.forEach((item, i) => {
    const color = COLORS[i % COLORS.length];
    ctx.strokeStyle = ctx.fillStyle = color;
    const kpts = item.kpts_xy;
    if (kpts && kpts.length) {
      const px = kpts.some((p) => p && (p[0] > 1.5 || p[1] > 1.5));
      const at = (p) => [p[0] * (px ? 1 : w), p[1] * (px ? 1 : h)];
      for (const [a, b] of kpts.length === 21 ? HAND : COCO) {
        if (!kpts[a] || !kpts[b]) continue;
        ctx.beginPath(); ctx.moveTo(...at(kpts[a])); ctx.lineTo(...at(kpts[b])); ctx.stroke();
      }
      for (const p of kpts) if (p) { ctx.beginPath(); ctx.arc(...at(p), ctx.lineWidth * 1.6, 0, 7); ctx.fill(); }
      return;
    }
    const box = item.bbox_xywh;
    if (!box) return;
    const [x, y, bw, bh] = box.map((v, k) => v * (k % 2 ? h : w));
    ctx.strokeRect(x, y, bw, bh);
    const label = item.text || item.label;
    if (!label) return;
    const text = item.score != null && !item.text ? `${label} ${item.score.toFixed(2)}` : label;
    const tw = ctx.measureText(text).width + font * 0.5;
    ctx.fillRect(x, Math.max(0, y - font * 1.3), tw, font * 1.3);
    ctx.fillStyle = "#0b0d10";
    ctx.fillText(text, x + font * 0.25, Math.max(font, y - font * 0.3));
  });
  const caption = body.text || body.value;
  if (typeof caption === "string") {
    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillRect(0, h - font * 3, w, font * 3);
    ctx.fillStyle = "#fff";
    ctx.fillText(caption.slice(0, Math.floor(w / (font * 0.55))), font * 0.5, h - font * 1.1);
  }
}
mark();
</script>
</body>
</html>
